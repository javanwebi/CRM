name: CRM CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://crm:ci-only-password@localhost:5432/crm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/api exec prisma generate --schema ../../packages/database/schema.prisma
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: PostgreSQL migration and idempotent runner
        run: |
          PGPASSWORD=ci-only-password psql -h localhost -U crm -d crm -f docker/init.sql
          pnpm db:migrate
          pnpm db:migrate
      - run: node --import tsx tests/native-smoke.ts
        env:
          DATABASE_ENV: test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.58.2
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://crm:ci-only-password@localhost:5432/crm
      - name: Docker Compose startup
        env:
          POSTGRES_PASSWORD: compose-only-test-password
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do
            if curl --fail http://localhost:3000/api/health; then ready=yes; break; fi
            sleep 3
          done
          if [ "${ready:-no}" != yes ]; then docker compose logs --no-color; exit 1; fi
          docker compose exec -T redis redis-cli ping
          docker compose exec -T -e QUEUE_SMOKE_ALLOWED=test worker node --import tsx apps/worker/src/smoke.ts
          QUEUE_SMOKE_ALLOWED=test node --import tsx tests/compose-operations.ts
      - if: always() && hashFiles('compose.yaml') != ''
        run: docker compose down
        env:
          POSTGRES_PASSWORD: compose-only-test-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results
